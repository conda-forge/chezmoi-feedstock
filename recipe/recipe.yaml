schema_version: 1

context:
  version: "2.71.0"

package:
  name: chezmoi
  version: ${{ version }}

source:
  url: https://github.com/twpayne/chezmoi/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 77f85f4d164f8ce0fc784b5d6ca86b0576a00729c5b23a113b92665e0509f252

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      content:
        # workaround https://github.com/prefix-dev/rattler-build/issues/2424
        - if: osx and x86_64
          then:
            - export HOME=${HOME:-$PWD}
        - chezmoi --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Manage your dotfiles across multiple diverse machines, securely
  homepage: https://chezmoi.io
  repository: https://github.com/twpayne/chezmoi

extra:
  recipe-maintainers:
    - anjos
    - danielnachun
