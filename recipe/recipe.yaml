schema_version: 1

context:
  version: "2.70.5"

package:
  name: chezmoi
  version: ${{ version }}

source:
  url: https://github.com/twpayne/chezmoi/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 653b6585db407c92ab902304136fa4516263c4e7e6e84163a3c1a186b3ddf55f

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      content:
        # workaround https://github.com/prefix-dev/rattler-build/issues/2424
        - if: osx and x86_64
          then:
            - export HOME=${HOME:-$PWD}
        - chezmoi --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Manage your dotfiles across multiple diverse machines, securely
  homepage: https://chezmoi.io
  repository: https://github.com/twpayne/chezmoi

extra:
  recipe-maintainers:
    - anjos
    - danielnachun
